<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mini Dropbox — La Mesa del Reino</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0b0b0d;
    color: #ede6d2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
    text-align: center;
    background: linear-gradient(180deg, #fdd65a, #e89a15);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub {
    color: #b8b0a0;
    font-size: 14px;
    text-align: center;
    margin: 0 0 28px;
    max-width: 320px;
    line-height: 1.5;
  }
  .drop {
    width: 100%;
    max-width: 360px;
    border: 2px dashed #3a3730;
    border-radius: 16px;
    padding: 36px 20px;
    text-align: center;
    background: #16151a;
  }
  .drop.dragover { border-color: #e89a15; background: #1c1a16; }
  input[type=file] { display: none; }
  label.pick {
    display: inline-block;
    padding: 14px 28px;
    background: #e89a15;
    color: #0b0b0d;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    font-size: 16px;
  }
  .hint { margin-top: 14px; font-size: 13px; color: #7a7468; }
  #list { width: 100%; max-width: 360px; margin-top: 24px; }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #16151a;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .status { font-size: 13px; flex-shrink: 0; }
  .status.ok { color: #7fd88a; }
  .status.err { color: #e06b6b; }
  .status.up { color: #b8b0a0; }
</style>
</head>
<body>
  <h1>Mini Dropbox</h1>
  <p class="sub">Selecciona las fotos o videos de referencia. Se suben directo, sin cuenta ni app.</p>

  <div class="drop" id="drop">
    <label class="pick" for="filepick">Elegir fotos o video</label>
    <input type="file" id="filepick" accept="image/*,video/*" multiple>
    <div class="hint">Puedes elegir varias a la vez</div>
  </div>

  <div id="list"></div>

<script>
const SUPA_URL = "https://kfuamhhfthfmavxppagb.supabase.co";
const SUPA_KEY = "sb_publishable_3fcJxym4ZcYqIVpAvu645Q_-dmnagRD";
const BUCKET = "mini-dropbox";

const picker = document.getElementById('filepick');
const list = document.getElementById('list');
const drop = document.getElementById('drop');

function safeName(name) {
  return name.replace(/[^a-zA-Z0-9._-]/g, '_');
}

function randomId() {
  return Math.random().toString(36).slice(2, 10);
}

async function uploadFile(file) {
  const row = document.createElement('div');
  row.className = 'item';
  row.innerHTML = `<span class="name">${file.name}</span><span class="status up">subiendo…</span>`;
  list.prepend(row);
  const statusEl = row.querySelector('.status');

  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  const path = `${stamp}-${randomId()}-${safeName(file.name)}`;

  try {
    const res = await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${encodeURIComponent(path)}`, {
      method: 'POST',
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': `Bearer ${SUPA_KEY}`,
        'Content-Type': file.type || 'application/octet-stream',
        'x-upsert': 'false',
      },
      body: file,
    });
    if (res.ok) {
      statusEl.textContent = 'listo ✓';
      statusEl.className = 'status ok';
    } else {
      const text = await res.text().catch(() => '');
      statusEl.textContent = 'error';
      statusEl.className = 'status err';
      statusEl.title = text;
    }
  } catch (err) {
    statusEl.textContent = 'error de red';
    statusEl.className = 'status err';
  }
}

picker.addEventListener('change', (e) => {
  const files = Array.from(e.target.files || []);
  files.forEach(uploadFile);
  picker.value = '';
});

['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, (e) => {
  e.preventDefault();
  drop.classList.add('dragover');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, (e) => {
  e.preventDefault();
  drop.classList.remove('dragover');
}));
drop.addEventListener('drop', (e) => {
  const files = Array.from(e.dataTransfer.files || []);
  files.forEach(uploadFile);
});
</script>
</body>
</html>
